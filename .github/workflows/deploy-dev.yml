name: Deploy Dev Frontend

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy to Dev
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-2
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          test -n "${AWS_ROLE_ARN}" || { echo "::error::Repository variable AWS_ROLE_ARN is not set."; exit 1; }
          test -n "${S3_BUCKET}" || { echo "::error::Repository variable FRONTEND_S3_BUCKET is not set."; exit 1; }
          test -n "${CLOUDFRONT_DISTRIBUTION_ID}" || { echo "::error::Repository variable FRONTEND_CLOUDFRONT_DISTRIBUTION_ID is not set."; exit 1; }
          if [ -z "${VITE_API_BASE_URL}" ]; then
            echo "::warning::Repository variable VITE_API_BASE_URL is not set. This is currently optional, but it will be needed once frontend API integration starts."
          else
            echo "VITE_API_BASE_URL is configured."
          fi
          echo "Deployment target"
          echo "AWS region: ${AWS_REGION}"
          echo "S3 bucket: ${S3_BUCKET}"
          echo "CloudFront distribution: ${CLOUDFRONT_DISTRIBUTION_ID}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -d dist || { echo "::error::Build output directory dist/ was not created."; exit 1; }
          test -f dist/index.html || { echo "::error::dist/index.html was not created."; exit 1; }
          echo "Build artifacts:"
          find dist -maxdepth 2 -type f | sort

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync build files to S3
        run: |
          set -euo pipefail
          echo "Uploading root static files with short cache"
          aws s3 sync dist/ "s3://${S3_BUCKET}" \
            --delete \
            --exclude "index.html" \
            --exclude "assets/*" \
            --cache-control "public, max-age=300"

          if [ -d dist/assets ]; then
            echo "Uploading hashed assets with long cache"
            aws s3 sync dist/assets/ "s3://${S3_BUCKET}/assets" \
              --delete \
              --cache-control "public, max-age=31536000, immutable"
          fi

          echo "Uploading index.html with no-cache"
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        run: |
          set -euo pipefail
          echo "Creating CloudFront invalidation for /*"
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
